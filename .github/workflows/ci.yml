name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  format:
    name: 💅 Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup

      - name: Run format check
        run: bun run format:check

  lint:
    name: 🕵 Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup

      - name: Run lint
        run: bun run lint:ci

  typecheck:
    name: ✅ Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup

      - name: Run typecheck
        run: bun run typecheck

  test:
    name: 🔬 Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup

      - name: Run tests with coverage gate
        run: bun run test:coverage

  build:
    name: 🧰 Pack (dist + validation)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build the publish artifact
        run: bun run pack

      - name: Verify the extension's publish tarball (dry run)
        working-directory: packages/pi
        run: npm publish --dry-run

      - name: Verify the engine's publish tarball (dry run)
        working-directory: packages/core
        run: npm publish --dry-run

      - name: Verify the OpenCode adapter's publish tarball (dry run)
        working-directory: packages/opencode
        run: npm publish --dry-run

      - name: Verify the OpenCode bundle and declarations name no host SDK
        run: |
          if grep -qE '@opencode/|lossless-core/src/' \
            packages/opencode/dist/index.mjs \
            packages/opencode/dist/index.d.mts; then
            echo "the published artifact names a host SDK or the engine source" >&2
            exit 1
          fi

  docs:
    name: 📖 Docs site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
          # blume --strict fails on BLUME_SHALLOW_GIT_HISTORY: lastmod reads git log per file.
          fetch-depth: 0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Validate docs links
        run: vp run --filter ./apps/docs validate --strict

      - name: Typecheck the docs app
        run: vp run --filter ./apps/docs check --isolated

      - name: Build the docs site
        run: vp run --filter ./apps/docs build

      - name: Audit the built site
        run: vp run --filter ./apps/docs audit

  audit:
    name: 🛡 Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup

      - name: bun audit (block on high/critical)
        shell: bash
        run: |
          # bun exits 1 both for findings at or above the level and for a
          # registry outage. An outage is a warning, not a block: we cannot
          # act on it. Capture the exit code directly; a pipe into tee would
          # report tee's status, not bun's.
          #
          # Ignored: two highs that live only outside a published tarball.
          # lodash-es comes from Blume 2.2.4's mermaid subtree (dagre-d3-es pins
          # 4.17.23), and path-to-regexp 6.1.0 from @astrojs/vercel's
          # routing-utils; the other path-to-regexp instance sits inside the
          # @earendil-works/pi-ai peer subtree the host supplies. Both bundles
          # keep their peers external. Reassess on every Blume or Pi bump; any
          # other path still blocks.
          set +e
          out=$(NO_COLOR=1 bun audit --audit-level=high \
            --ignore=GHSA-r5fr-rjxr-66jc \
            --ignore=GHSA-9wv6-86v2-598j \
            2>&1)
          code=$?
          set -e
          printf '%s\n' "$out"
          if [ "$code" -eq 0 ]; then exit 0; fi
          # bun 1.4.4 wording: "error: POST <url> - ConnectionRefused",
          # "<registry> did not answer the audit request; skipped",
          # "<registry> returned a non-JSON audit response".
          if ! grep -qE '[0-9]+ vulnerabilit' <<<"$out" &&
             grep -qE 'error: (GET|POST) |did not answer the audit request|non-JSON audit response' <<<"$out"; then
            echo "::warning::advisory registry unreachable; audit skipped"
            exit 0
          fi
          exit "$code"

  ci-complete:
    name: CI complete
    needs: [format, lint, typecheck, test, build, docs, audit]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any required job failed
        if: |
          needs.format.result != 'success' ||
            needs.lint.result != 'success' ||
            needs.typecheck.result != 'success' ||
            needs.test.result != 'success' ||
            needs.build.result != 'success' ||
            needs.docs.result != 'success' ||
            needs.audit.result != 'success'
        run: exit 1

      - name: OK
        run: echo "CI requirements satisfied"
