name: Deploy docs

on:
  workflow_dispatch:
  release:
    types: [published]
  pull_request:
    types: [closed]
    branches: [main]
  # Async release follow-up: releases created by changesets with GITHUB_TOKEN
  # cannot trigger `release: published` downstream (GITHUB_TOKEN events spawn
  # no new runs). workflow_run fires regardless of token, in its own run —
  # Release stays untouched. Read from main, so this takes effect post-merge.
  workflow_run:
    workflows: [Release]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-docs-production
  cancel-in-progress: false

jobs:
  deploy:
    name: 🚀 Build & Deploy docs (FTP)
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'release' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.merged == true &&
       contains(github.event.pull_request.labels.*.name, 'docs')) ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # The release-tag gate below needs tags even on branch checkouts.
          fetch-tags: true
          # A closed PR checkout defaults to a dead merge ref, so pin the merge commit on main.
          # A workflow_run checkout defaults to default-branch HEAD, so pin the run's head SHA.
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.merge_commit_sha || github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          # The sitemap's lastmod reads `git log` per file.
          fetch-depth: 0

      # Release runs on every main push; deploy only when its head shipped
      # a release (any tag present — every tag in these repos is a
      # changesets release tag). Skips green — no red noise.
      - name: Require release tag on head
        id: gate
        if: github.event_name == 'workflow_run'
        run: |
          if git tag --points-at HEAD | grep -q .; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Bun
        uses: ./.github/actions/setup

      - name: Validate docs links
        run: vp run --filter ./apps/docs validate --strict

      - name: Typecheck docs site
        run: vp run --filter ./apps/docs check --isolated

      - name: Build docs site
        run: vp run --filter ./apps/docs build

      - name: Audit docs site
        run: vp run --filter ./apps/docs audit

      - name: Upload to /lossless via FTP
        # Gate runs on workflow_run only; skipped (empty) elsewhere — upload proceeds.
        if: steps.gate.outputs.release != 'false'
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          security: strict
          local-dir: ./apps/docs/dist/
          server-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
