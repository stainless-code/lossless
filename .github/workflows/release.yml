# [Changesets](https://github.com/changesets/changesets): open a "Version packages" PR when
# `.changeset/*.md` files land on `main`, then publish to npm when that PR merges via npm
# trusted publishing (GitHub OIDC — no NPM_TOKEN; provenance auto-generated).
name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      # npm trusted publishing (OIDC) needs npm >= 11.5.1 (docs.npmjs.com/trusted-publishers).
      # setup-bun leaves the runner's npm 10.x in PATH, so `npm publish` can't detect OIDC
      # and fails with ENEEDAUTH. Node 24 ships npm 11.x; npm then auto-authenticates via OIDC
      # (no token). This repo keeps zero native dependencies (node:sqlite), so unlike native-addon
      # repos there is no node-gyp ABI concern with switching Node before `bun install`.
      - name: Setup Node + npm for trusted publishing
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Setup Bun and install
        uses: ./.github/actions/setup

      # Opens/updates the Version PR when `.changeset/*.md` exist. When there are none, the action
      # can still run `publish` (see changesets/action) so a just-merged Version PR can ship.
      # `changeset publish` should exit 0 when there is nothing new to publish. If this job fails,
      # read the step log: common causes are OIDC/trusted-publishing misconfig (`id-token: write`,
      # the `release` environment, or the npm trusted-publisher binding), registry/network errors,
      # or a real publish failure — not assumed from the runner alone.
      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          # Runs `changeset version` then formats CHANGELOG.md so `format:check` passes
          # (see the `version` script in package.json).
          version-script: bun run version
          publish-script: bun run release
          pr-title: "chore: version packages"
          commit-message: "chore: version packages"
          create-github-releases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
